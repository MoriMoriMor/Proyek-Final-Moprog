<!DOCTYPE html>
<html lang="id">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4056BD">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Temukan dan bagikan tempat yang layak diceritakan.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Spots">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Spots</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { margin: 0; background: #F3F5FC; }
    #spots-loading {
      position: fixed; inset: 0; display: grid; place-content: center;
      justify-items: center; gap: 28px;
      background: linear-gradient(140deg, #E8EDFF, #F4F6FF 65%, #FFF6EF);
    }
    #spots-loading img { width: 152px; height: auto; }
    .loading-track {
      width: 96px; height: 3px; border-radius: 3px;
      overflow: hidden; background: #E2E6F5;
    }
    .loading-track::after {
      content: ''; display: block; width: 48px; height: 3px;
      background: #4056BD; border-radius: inherit;
      animation: loading 1.2s ease-in-out infinite alternate;
    }
    @keyframes loading { from { transform: translateX(-24px); } to { transform: translateX(72px); } }
    @media (prefers-reduced-motion: reduce) {
      .loading-track::after { animation: none; transform: translateX(24px); }
    }
  </style>
</head>
<body>
  <div id="spots-loading" role="status" aria-label="Membuka Spots">
    <img src="assets/assets/logo.svg" alt="Spots" width="152" height="48">
    <div class="loading-track" aria-hidden="true"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('spots-loading')?.remove();
    }, { once: true });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
