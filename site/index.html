<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spots — Wajib Datang Mulai dari Sini</title>
  <meta name="description" content="Spots: temukan kedai kopi, kuliner warga lokal, peta sekitar, dan jajan langsung dari cerita jujur orang sekitar.">
  <link rel="icon" href="app_icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="space-landing">
  <canvas id="space-bg" class="space-bg" aria-hidden="true"></canvas>

  <main class="landing-shell">
    <section class="glass-hero-card">
      <div class="brand-pill">
        <img src="app_icon.svg" alt="" width="28" height="28">
        <span>spots<b>.</b></span>
      </div>
      <p class="kicker">Spot berikutnya</p>
      <h1 class="sticker-title">Wajib Datang</h1>
      <span class="highlight-pill">mulai dari sini</span>
      <p class="lead">Jelajahi ribuan titik kuliner, kedai kopi, taman, dan belanja langsung dari cerita warga sekitar.</p>
      <div class="cta-dark-pill">
        <span class="cta-arrow" aria-hidden="true">&rarr;</span>
        <span>Tersedia di Android, Web &amp; Windows</span>
      </div>
    </section>

    <section class="globe-stage" aria-label="Ilustrasi Globe Bumi 3D Spots dengan pin lokasi">
      <canvas id="earth-globe"></canvas>
      <div id="globe-chips" aria-hidden="true"></div>
    </section>
  </main>

  <script src="globe.js"></script>
</body>
</html>
