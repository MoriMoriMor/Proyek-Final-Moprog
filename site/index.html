<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spots — Wajib Datang Mulai dari Sini</title>
  <meta name="description" content="Spots: temukan kedai kopi, kuliner warga lokal, peta sekitar, dan jajan langsung dari cerita jujur orang sekitar.">
  <link rel="icon" href="app_icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scenic-bg" aria-hidden="true">
    <img src="photos/hangout.jpg" alt="">
    <div class="scenic-veil"></div>
    <div class="scenic-clouds"></div>
    <div class="scenic-hills"></div>
  </div>

  <main class="landing-shell">
    <section class="glass-hero-card">
      <div class="brand-pill">
        <img src="app_icon.svg" alt="" width="28" height="28">
        <span>spots<b>.</b></span>
      </div>
      <p class="kicker">Spot berikutnya</p>
      <h1 class="sticker-title" data-text="Wajib Datang">Wajib Datang</h1>
      <span class="highlight-pill">mulai dari sini</span>
      <p class="lead">Temukan kedai kopi, kuliner asli warga lokal, peta sekitar, dan pesan langsung tanpa antre.</p>
      <div class="cta-dark-pill">
        <span class="cta-arrow" aria-hidden="true">&rarr;</span>
        <span>Tersedia di Android, Web &amp; Windows</span>
      </div>
      <p class="credit-line">Foto berlisensi terbuka dari Wikimedia Commons.</p>
    </section>

    <section class="collage-stage" aria-label="Kolase tampilan aplikasi Spots">
      <div class="glass-aura"></div>
      <figure class="polaroid polaroid-a">
        <img src="photos/kuliner.jpg" alt="Rawon Setan khas Surabaya">
        <figcaption>Rawon Setan · Surabaya</figcaption>
      </figure>
      <div class="glass-note note-top">Kuahnya asli<br>juara banget!</div>
      <figure class="polaroid polaroid-b">
        <img src="photos/taman.jpg" alt="Suasana taman kota sore hari">
        <figcaption>Tugu Pahlawan · 650 m</figcaption>
      </figure>
      <div class="glass-note note-bottom">18 spot seru dekatmu</div>
    </section>
  </main>
</body>
</html>
