<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Spots — Spot Terbaik di Sekitarmu</title>
  <meta name="description" content="Spots: temukan kedai kopi, warung lokal, dan sudut kota dari cerita jujur warga sekitar, lengkap dengan rute langsung dan pemesanan lokal.">
  <link rel="icon" href="app_icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="showcase">
    <section class="phone-card">
      <div class="sky-hero">
        <div class="sky-top">
          <img src="app_icon.svg" alt="" width="28" height="28">
          <span>spots<b>.</b></span>
        </div>
        <div class="sky-watermark" aria-hidden="true">SPOTS</div>
        <figure class="hero-photo">
          <img src="photos/hangout.jpg" alt="Suasana hangat kedai kopi lokal">
          <div class="photo-pills-top">
            <span class="glass-pill">Dekat kamu</span>
            <span class="glass-pill">Populer</span>
          </div>
          <div class="photo-headline">KETEMU SPOT<br>FAVORITMU</div>
          <figcaption class="photo-bottom">
            <strong>Kopi Sudut Sore</strong>
            <small>Surabaya · 650 m dari sini</small>
            <div class="photo-tags">
              <span>Kopi</span><span>Nongkrong</span><span>Buka</span>
            </div>
          </figcaption>
        </figure>
      </div>
      <div class="sheet-panel">
        <div class="sheet-dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
        <h1>Spot Terbaik Hanya<br>Satu Geseran Saja</h1>
        <p>Temukan kedai kopi, warung lokal, dan sudut kota dari cerita jujur orang sekitar.</p>
        <div class="cta-pill">
          <span class="cta-disc" aria-hidden="true">&rarr;</span>
          <span class="cta-label">Tersedia di Android, Web &amp; Windows</span>
        </div>
        <p class="credit-line">Foto berlisensi terbuka dari Wikimedia Commons.</p>
      </div>
    </section>
  </main>
</body>
</html>
